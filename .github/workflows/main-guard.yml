# The red-X sentinel. It cannot block a push (branch protection is a paid
# feature), but every commit that lands on main without a pull request gets a
# public red X and an email to whoever pushed it. Sprint 2 runs branch -> PR ->
# merge; this is the scoreboard. Staff maintenance pushes are exempt.
name: main is PR-only
on:
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Was this a pull request merge?
        uses: actions/github-script@v7
        with:
          script: |
            const staff = ["carl-techfellow", "crafty-arl", "jakwounreid"];
            if (staff.includes(context.actor.toLowerCase())) {
              core.info("Staff maintenance push - exempt.");
              return;
            }
            const { data: prs } = await github.request(
              "GET /repos/{owner}/{repo}/commits/{ref}/pulls",
              { owner: context.repo.owner, repo: context.repo.repo, ref: context.sha });
            const merged = prs.find((p) => p.merged_at);
            if (merged) {
              core.info("Arrived via PR #" + merged.number + " - as it should.");
            } else {
              core.setFailed(
                "This commit landed on main without a pull request. " +
                "Sprint 2 works branch -> PR -> merge: put your work on a branch, " +
                "open a PR, and have a teammate review it. Nothing here is broken - " +
                "this X is the reminder.");
            }
